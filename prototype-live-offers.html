<!doctype html>
<html lang="en" class="op">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — Live offers UI (no auth)</title>
    <script>
      (function () {
        var root = document.documentElement
        root.classList.add("op")
        try {
          var preference = localStorage.getItem("tummly-theme") || "system"
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
          var dark =
            preference === "dark" || (preference === "system" && systemDark)
          root.classList.toggle("dark", dark)
          root.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {
          root.classList.remove("dark")
          root.style.colorScheme = "light"
        }
      })()
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/prototypes/live-offers-ui/main.tsx"></script>
  </body>
</html>
