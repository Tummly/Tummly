<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tummly" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- CRITICAL_PRELOADS -->
    <title>Tummly</title>
    <!--
      Operator appearance preference: apply before paint.
      Keep path list in sync with OPERATOR_DASHBOARD_PATHS in
      src/lib/operatorAppearance.ts (storage key tummly-theme).
    -->
    <script>
      (function () {
        var path = location.pathname;
        var isDashboard =
          path === "/single-dashboard" || path === "/multi-dashboard";
        var root = document.documentElement;
        if (!isDashboard) {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
          return;
        }
        try {
          var preference = localStorage.getItem("tummly-theme") || "system";
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var dark =
            preference === "dark" ||
            (preference === "system" && systemDark);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          root.classList.remove("dark");
          root.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
