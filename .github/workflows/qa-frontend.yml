name: QA — frontend (Static Web Apps)

on:
  push:
    branches: [qa]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "components.json"
      - ".github/workflows/qa-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          # Until custom domain: ACA default host. Override via repo variable VITE_API_BASE_URL.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ca-tummly-qa-api.agreeablewater-62e50314.uksouth.azurecontainerapps.io/api' }}
          VITE_APP_ENV: qa
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
