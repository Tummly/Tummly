name: QA — backend (ACR → Container Apps)

on:
  push:
    branches: [qa]
    paths:
      - "backend/TummlyBackend/**"
      - ".github/workflows/qa-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_NAME: acrtummlyqavfavue
      ACR_LOGIN_SERVER: acrtummlyqavfavue.azurecr.io
      RESOURCE_GROUP: rg-tummly-qa
      CONTAINER_APP: ca-tummly-qa-api
      IMAGE_NAME: tummly-api
      # User-assigned MI on the Container App (Blob + AcrPull)
      API_MANAGED_IDENTITY_CLIENT_ID: 55d29a4d-e60d-44ab-9aab-9bb69ee0ab08

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: EF migration gates (ADR-0015)
        working-directory: backend/TummlyBackend
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Database=ci;User Id=ci;Password=ci;TrustServerCertificate=True"
        run: |
          bash scripts/check-migration-designer-pairs.sh Migrations
          dotnet tool restore
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet ef migrations has-pending-model-changes \
            --project TummlyBackend.csproj \
            --startup-project TummlyBackend.csproj
          bash scripts/check-migrations-list-vs-files.sh Migrations TummlyBackend.csproj

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ env.ACR_NAME }}"

      - name: Build and push image
        working-directory: backend/TummlyBackend
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:qa"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update Container App
        run: |
          IDENTITY_RESOURCE_ID="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourcegroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-tummly-qa-api"

          # Ensure ACA pulls from ACR via user-assigned MI (AcrPull)
          az containerapp registry set \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "${{ env.ACR_LOGIN_SERVER }}" \
            --identity "$IDENTITY_RESOURCE_ID"

          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}" \
            --set-env-vars \
              "ASPNETCORE_URLS=http://+:8080" \
              "AZURE_CLIENT_ID=${{ env.API_MANAGED_IDENTITY_CLIENT_ID }}" \
            --cpu 0.5 \
            --memory 1.0Gi

          # Target port for the real .NET image (placeholder was 80)
          az containerapp ingress update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --target-port 8080 \
            --type external

      - name: Ensure health probes (ADR-0015)
        run: |
          # Targeted PATCH — only containers (with probes) + Single revision mode.
          # Avoids full --yaml replace that can drop write-only secrets.
          SUB="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          RG="${{ env.RESOURCE_GROUP }}"
          NAME="${{ env.CONTAINER_APP }}"
          API="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.App/containerApps/${NAME}?api-version=2024-03-01"

          az rest --method get --url "$API" -o json > /tmp/ca.json

          python3 <<'PY'
          import json
          with open("/tmp/ca.json") as f:
              app = json.load(f)

          containers = app["properties"]["template"]["containers"]
          containers[0]["probes"] = [
              {
                  "type": "Startup",
                  "httpGet": {"path": "/health/ready", "port": 8080, "scheme": "HTTP"},
                  "initialDelaySeconds": 10,
                  "periodSeconds": 20,
                  "timeoutSeconds": 5,
                  "failureThreshold": 10,
              },
              {
                  "type": "Readiness",
                  "httpGet": {"path": "/health/ready", "port": 8080, "scheme": "HTTP"},
                  "initialDelaySeconds": 10,
                  "periodSeconds": 20,
                  "timeoutSeconds": 5,
                  "failureThreshold": 10,
              },
              {
                  "type": "Liveness",
                  "httpGet": {"path": "/health", "port": 8080, "scheme": "HTTP"},
                  "initialDelaySeconds": 30,
                  "periodSeconds": 30,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3,
              },
          ]

          body = {
              "properties": {
                  "configuration": {
                      "activeRevisionsMode": "Single"
                  },
                  "template": {
                      "containers": containers
                  },
              }
          }
          with open("/tmp/ca-probes-patch.json", "w") as f:
              json.dump(body, f)
          PY

          az rest --method patch --url "$API" --body @/tmp/ca-probes-patch.json
